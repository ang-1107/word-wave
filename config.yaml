runtime:
  model_path: word-wave.pt
  tokenizer_path: tokenizer.pt
  latest_checkpoint_path: word-wave.latest.pt
  best_checkpoint_path: word-wave.best.pt
  default_seed_text: Artificial intelligence is
  default_generation_length: 10
  max_generation_length: 20
  default_beam_width: 5
  default_sampling_temperature: 1.0
  default_top_k: 0
  default_top_p: 0.9
  default_repetition_penalty: 1.2
  default_no_repeat_ngram_size: 2
  default_decoding_strategy: beam_search
  default_corpus_size_mb: 64

training:
  max_len: 128
  max_vocab_size: 32000
  embedding_dim: 512
  hidden_dim: 1024
  num_layers: 2
  dropout: 0.3
  batch_size: 128
  epochs: 3
  learning_rate: 0.001
  gradient_clip_norm: 1.0
  lr_scheduler_patience: 1
  early_stopping_patience: 3
  early_stopping_min_delta: 0.0001
  use_mixed_precision: true
  validation_fraction: 0.05
  test_fraction: 0.05
  seed: 42
  evaluation_sample_size: 500
  label_smoothing: 0.1
  lr_warmup_epochs: 1
  tie_weights: true
