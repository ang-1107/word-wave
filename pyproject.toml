[build-system]
requires = ["setuptools>=58", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "word-wave"
version = "0.1.0"
description = "WordWave is a Streamlit app for next-word and short-sequence prediction using a PyTorch BiLSTM with attention."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
  { name = "Angel Mandhwani", email = "angelmandhwani.24@kgpian.iitkgp.ac.in" },
]
keywords = ["streamlit", "pytorch", "nlp", "text-generation", "machine-learning"]
dependencies = [
  "numpy>=2.0.2,<3.0.0",
  "nltk>=3.9.2,<4.0.0",
  "pyyaml>=6.0.3,<7.0.0",
  "tqdm>=4.67.1,<5.0.0",
  "torch>=2.8.0,<3.0.0",
  "streamlit>=1.50.0,<2.0.0",
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

[project.optional-dependencies]
dev = [
  "black>=24.8.0,<25.0.0",
  "pre-commit>=4.0.0,<5.0.0",
  "pytest>=8.0.0,<9.0.0",
  "pyright>=1.1.390,<2.0.0",
  "ruff>=0.6.0,<1.0.0",
]

[project.urls]
Homepage = "https://github.com/ang-1107/word-wave"
Repository = "https://github.com/ang-1107/word-wave"

[tool.setuptools]
packages = ["src"]

[tool.black]
line-length = 88
target-version = ["py310"]
include = '\.pyi?$'
extend-exclude = '''
/(
  \.git
  | \.venv
  | \.ipynb_checkpoints
  | __pycache__
)/
'''

[tool.ruff]
target-version = "py310"
fix = true
extend-exclude = [".venv", ".ipynb_checkpoints"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["src"]
combine-as-imports = true
force-sort-within-sections = false

[tool.pyright]
pythonVersion = "3.10"
include = ["app.py", "src"]
typeCheckingMode = "basic"
